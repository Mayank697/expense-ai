services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: expense-ai-postgres
    environment:
      POSTGRES_DB: expense_ai
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_password
    ports:
      - "5432:5432"
    volumes:
      - expense_ai_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: expense-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - expense_ai_ollama_data:/root/.ollama

volumes:
  expense_ai_postgres_data:
  expense_ai_ollama_data:
